worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;

    log_format debug_log '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '$upstream_addr $upstream_response_time $request_time';

    gzip_static  on;
    gzip on;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    upstream django {
        server web:8001;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name PROD_URL;

        client_max_body_size 500M;

        keepalive_timeout           300;
        proxy_connect_timeout       300;
        proxy_send_timeout          300;
        proxy_read_timeout          300;
        send_timeout                300;

        access_log /var/log/nginx/access.log debug_log;
        error_log /var/log/nginx/error.log debug;

        location / {
            proxy_pass              http://django;
            proxy_pass_header       Set-Cookie;

            proxy_set_header        Host                 $http_host;
            proxy_set_header        X-Real-IP            $remote_addr;
            proxy_set_header        X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto    $scheme;
            proxy_set_header        X-Forwarded-Host     $server_name;
            proxy_set_header        X-NginX-Proxy        true;
            proxy_set_header        Upgrade              $http_upgrade;
            proxy_set_header        Connection           "upgrade";

            proxy_http_version      1.1;
            proxy_redirect          off;
        }

        location /static/ {
            autoindex off;
            alias /usr/share/nginx/html/static/;
        }

        location /media/ {
            autoindex off;
            # path to the mounted data folder inside the nginx docker container.
            alias /data/;
        }

        location /favicon.ico {
            alias /usr/share/nginx/html/static/img/favicon.ico;
        }
    }
}
