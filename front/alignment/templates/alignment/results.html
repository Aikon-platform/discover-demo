{% load static %}
{% if object.status == "SUCCESS" %}
    <div class="centerwrap details-wrapper detailed">
        <h3>Alignment results</h3>

        {% if object.alignment_results %}
            <a href="{{ object.get_download_json_url }}"
               class="button is-link" download>
                <span class="iconify" data-icon="mdi:json"></span>
                <span>Download alignment data</span>
            </a>
        {% endif %}

        {% if not object.dataset %}
            <div class="message mt-5">
                <div class="message-body">
                    <p>Dataset was deleted</p>
                </div>
            </div>
        {% endif %}

        <div class="widen">
            <div id="matches" class="alignment-viewer"></div>
        </div>

        <script type="text/javascript">
            document.addEventListener("DOMContentLoaded", () => {
                DemoTools.initAlignmentApp(
                    document.getElementById("matches"),
                    "{{ object.alignment_display_url|escapejs }}");
            });
        </script>
    </div>
{% endif %}
